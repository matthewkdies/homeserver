# ------------------------------------------------------------------------
# CrowdSec is a modern, collaborative intrusion prevention system.
# It parses application logs (Caddy, SSH, etc.), detects attacks using
# behavioral scenarios, and shares consensus threat intelligence globally.
# ------------------------------------------------------------------------

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    hostname: crowdsec
    environment:
      TZ: America/New_York
      COLLECTIONS: "crowdsecurity/caddy LePresidente/authelia crowdsecurity/linux crowdsecurity/whitelist-good-actors"
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - caddy_logs:/var/log/caddy:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - ${DOCKER_DIR}/authelia/authelia.log:/var/log/authelia/authelia.log:ro
      - ${COMPOSE_DIR}/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
    expose:
      - 8080
    networks:
      webapps:
        ipv4_address: 172.19.0.33
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  crowdsec_data:
  crowdsec_config:
  caddy_logs:
    external: true
    name: caddy_caddy_logs

networks:
  webapps:
    external: true
