# ----------------------------------------------------------------------------------------
# The below containers all serve to supplement and automate a lot of Plex management.
# For this reason, the Plex compose is kept separate, so that changes to these services
# won't affect the availability of Plex itself.
#
# The current capabilities of this stack:
#   1. Handling Plex users' content requests (seerr)
#   2. Creation of a VPN container that uses my Mullvad account (gluetun)
#   3. Usage of VPN container to torrent **LEGAL CONTENT ONLY!** (qbittorrent)
#   4. Automated management of handling connections to torrent clients (prowlarr)
#       - Proxy container for bypassing some Cloudflare protections (flaresolverr)
#   5. Automated media importing, renaming, management, and upgrading for
#       - TV shows (sonarr)
#       - movies (radarr)
#       - music (lidarr)
#   6. Automated fetching of subtitles for media (bazarr)
#   7. Transcoding of video media to meet custom-set specifications (tdarr)
#   8. Plex activity monitoring (tautilli)
#   9. Usage of the soulseek network to get free-use music from other users (soulseek)
#   10. Connection between Lidarr's wanted list and Soulseek container (soularr)
#   11. Automatic creation of Plex music playlists based on listening habit (meloday)
#   12. Deletion of content based on configurable rules (maintainerr)
#
# Unfortunately, I haven't been great at keeping helpful links as I go so far.
# Those that I remember off the top of my head are listed below:
#   - https://trash-guides.info/: Helpful guides for configuring media management clients
#   - https://drfrankenstein.co.uk/: Basically my source of truth for configuring this all
#   - https://github.com/qdm12/gluetun/discussions/805#discussioncomment-2026642: getting
#     the VPN working requires setting the `WIREGUARD_ADDRESSES` and
#     `WIREGUARD_PRIVATE_KEY` variables, here's a comment on how to do so
# ----------------------------------------------------------------------------------------

# TODO: Add API keys to secrets for healthchecks
name: arr-suite

secrets:
  wireguard-private-key:
    file: ${SECRETS_DIR}/gluetun_wireguard_private_key
  wireguard-addresses:
    file: ${SECRETS_DIR}/gluetun_wireguard_addresses
  sonarr_api_key:
    file: ${SECRETS_DIR}/sonarr_api_key
  radarr_api_key:
    file: ${SECRETS_DIR}/radarr_api_key
  radarr_4k_api_key:
    file: ${SECRETS_DIR}/radarr_4k_api_key

services:
  # tv show monitoring + management
  sonarr:
    image: linuxserver/sonarr:4.0.20.3014-ls328@sha256:0deb8db6c839ac475e9cd86277712772c40ba7f929a003d7e1de36c4b666bc13
    container_name: sonarr
    hostname: sonarr
    environment:
      PUID: 133
      PGID: 65536
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:8989/api/v3/health?apikey=${SONARR_API_KEY} || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    volumes:
      - sonarr_config:/config
      - ${DATA_DIR}:/data
      - ${DATA2_DIR}:/data2
      - ${DATA3_DIR}:/data3
    expose:
      - 8989
    networks:
      webapps:
        ipv4_address: 172.19.0.9 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - qbittorrent
    restart: unless-stopped

  # movie monitoring + management
  radarr:
    image: linuxserver/radarr:6.4.4.10685-ls320@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
    container_name: radarr
    hostname: radarr
    environment:
      PUID: 136
      PGID: 65536
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:7878/api/v3/health?apikey=${RADARR_API_KEY} || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    volumes:
      - radarr_config:/config
      - ${DATA_DIR}:/data
      - ${DATA2_DIR}:/data2
      - ${DATA3_DIR}:/data3
    expose:
      - 7878
    networks:
      webapps:
        ipv4_address: 172.19.0.8 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - qbittorrent
    restart: unless-stopped

  radarr4k:
    image: linuxserver/radarr:6.4.4.10685-ls320@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
    container_name: radarr4k
    hostname: radarr4k
    environment:
      PUID: 136
      PGID: 65536
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:7878/api/v3/health?apikey=${RADARR_4K_API_KEY} || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    volumes:
      - radarr4k_config:/config
      - ${DATA3_DIR}:/data3
    expose:
      - 17878
    networks:
      webapps:
        ipv4_address: 172.19.0.20 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - qbittorrent
      - radarr
    restart: unless-stopped

  # music monitoring + management
  lidarr:
    image: linuxserver/lidarr:3.1.0.4875-ls43@sha256:67887807b13ae025c0fe979da298347c8609969087ab064c81d8e9acc1e06bbf
    container_name: lidarr
    hostname: lidarr
    environment:
      PUID: 137
      PGID: 65536
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:8686/api/v1/health?apikey=${LIDARR_API_KEY} || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    volumes:
      - lidarr_config:/config
      - ${DATA_DIR}:/data
      - ${DATA2_DIR}:/data2
      - ${DATA3_DIR}:/data3
    expose:
      - 8686
    networks:
      webapps:
        ipv4_address: 172.19.0.12 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - qbittorrent
    restart: unless-stopped

  # torrent client monitoring + management
  prowlarr:
    image: linuxserver/prowlarr:2.6.5.5623-ls163@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902
    container_name: prowlarr
    hostname: prowlarr
    environment:
      PUID: 138
      PGID: 133
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:9696/api/v1/health?apikey=${PROWLARR_API_KEY} || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    volumes:
      - prowlarr_config:/config
    expose:
      - 9696
    networks:
      webapps:
        ipv4_address: 172.19.0.10 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # subtitle monitoring + management
  bazarr:
    image: linuxserver/bazarr:v1.6.2-ls368@sha256:fb0437897eaa7f96cf6ac42f795f8dcc208d34ec969eac5d366454e767304eb9
    container_name: bazarr
    hostname: bazarr
    environment:
      PUID: 139
      PGID: 65536
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:6767/api/system/status?apikey=${BAZARR_API_KEY} || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    volumes:
      - bazarr_config:/config
      - ${DATA_DIR}:/data
      - ${DATA2_DIR}:/data2
      - ${DATA3_DIR}:/data3
      - ${COMPOSE_DIR}/arr-suite/bazarr-subcleaner:/subcleaner
    expose:
      - 6767
    networks:
      webapps:
        ipv4_address: 172.19.0.11 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # content request monitoring + management
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    init: true
    container_name: seerr
    hostname: seerr
    environment:
      PUID: 140
      PGID: 136
      TZ: America/New_York
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    volumes:
      - overseerr_config:/app/config
    expose:
      - 5055
    networks:
      webapps:
        ipv4_address: 172.19.0.7 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # transcoding of video files
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest@sha256:5b3b8d4e54f41738d12ff71705cf8eb8e90fcbcc05209c331853aef119879992
    container_name: tdarr
    hostname: tdarr
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      webapps:
        ipv4_address: 172.19.0.13 # static IP for in-app config
    # healthcheck:
    #   test: wget --no-verbose --tries=1 --spider http://localhost:8265/ || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 30s
    expose:
      - 8265
      - 8266
    environment:
      TZ: America/New_York
      PUID: 141
      PGID: 65536
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: true
      inContainer: true
      nodeID: InternalNode
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${DOCKER_DIR}/tdarr/server:/app/server
      - ${DOCKER_DIR}/tdarr/configs:/app/configs
      - ${DOCKER_DIR}/tdarr/logs:/app/logs
      - ${DOCKER_DIR}/tdarr/transcode:/transcode
      - ${DATA_DIR}/media:/media
      - ${DATA2_DIR}/media:/media2
      - ${DATA3_DIR}/media:/media3
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # helps to bypass Cloudflare protection used by many indexers
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    hostname: flaresolverr
    environment:
      TZ: America/New_York
    # healthcheck:
    #   test: curl -f http://localhost:8191 || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 60s
    volumes:
      - flaresolverr_config:/config
    expose:
      - 8191
    networks:
      webapps:
        ipv4_address: 172.19.0.14 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prowlarr
    restart: unless-stopped

  # VPN client container
  gluetun:
    image: qmcgaw/gluetun:v3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    hostname: gluetun
    cap_add:
      - NET_ADMIN
    expose:
      # since gluetun acts as a network, everything that runs on it needs exposed here
      # so in order to expose apps on the VPN to the internet, we need to expose ports here
      - 8090 # qbittorrent
      - 9191 # dispatcharr
    ports:
      - 8888:8888/tcp # HTTP proxy (tunnels HTTP and HTTPS through TCP)
      - 8388:8388/tcp # Shadowsocks proxy server (protocol based on SOCKS5 with an encryption layer, tunnels TCP+UDP)
      - 8388:8388/udp # Shadowsocks proxy server (protocol based on SOCKS5 with an encryption layer, tunnels TCP+UDP)
    volumes:
      - gluetun_config:/gluetun
    environment:
      PUID: 132
      PGID: 132
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard-private-key
      WIREGUARD_ADDRESSES_SECRETFILE: /run/secrets/wireguard-addresses
      SERVER_CITIES: Zurich
      SERVER_COUNTRIES: Switzerland
      TZ: America/New_York
      HTTPPROXY: off
      SHADOWSOCKS: off
      FIREWALL_OUTBOUND_SUBNETS: 172.19.0.0/16,10.144.88.0/24
      UPDATER_PERIOD: 24h
    secrets:
      - wireguard-private-key
      - wireguard-addresses
    networks:
      webapps:
        ipv4_address: 172.19.0.15 # static IP for in-app config
    devices:
      - /dev/net/tun:/dev/net/tun
    labels:
      - com.centurylinklabs.watchtower.enable=false # manually update, so that network is up
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # torrenting client
  qbittorrent:
    image: linuxserver/qbittorrent:5.2.4_v2.0.15-ls480@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
    container_name: qbittorrent
    environment:
      PUID: 142
      PGID: 65536
      TZ: America/New_York
      WEBUI_PORT: 8090
      DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent # https://github.com/arafatamim/linuxserver-io-mod-vuetorrent/issues/8
    # healthcheck:
    #   test: >
    #     curl -i --header 'Referer: http://localhost:8090' --data 'username=${QBITTORRENT_USERNAME}&password=${QBITTORRENT_PASSWORD}' http://localhost:8090/api/v2/auth/login || exit 1
    #   interval: 5m00s
    #   timeout: 10s
    #   retries: 2
    #   start_period: 120s
    volumes:
      - qbittorrent_config:/config
      - ${DATA_DIR}/torrents:/data/torrents
      - ${DATA2_DIR}/torrents:/data2/torrents
      - ${DATA3_DIR}/torrents:/data3/torrents
    network_mode: service:gluetun # run on the vpn network from above gluetun container
    depends_on:
      gluetun:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # connects to the soulseek network to download royalty-free music
  soulseek:
    image: slskd/slskd:0.26.1@sha256:588af49abc3088d639c8f1174d3bfad6e92c093a275a593140e3ac9311ebf6c4
    container_name: soulseek
    hostname: soulseek
    expose:
      - 5030
    ports:
      - 50300:50300/tcp
    environment:
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_INCOMPLETE_DIR: /incomplete
      SLSKD_UMASK: 2
    volumes:
      - soulseek_data:/app/data
      - soulseek_config:/app
      - ${DATA3_DIR}/music/downloads:/downloads
      - ${DATA3_DIR}/music/incomplete:/incomplete
      - ${DATA_DIR}/media/music:/music
      - ${DATA2_DIR}/media/music:/music2
      - ${DATA3_DIR}/media/music:/music3
      - ${DOCKER_DIR}/soulseek/slskd.yml:/app/slskd.yml
    user: 146:65536
    networks:
      webapps:
        ipv4_address: 172.19.0.18 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # links lidarr to soulseek, starting downloads and running manual imports
  soularr:
    image: mrusse08/soularr:v1.2.2@sha256:c4f97924fabfce4e0de539d821ea7d20519b95c4815a707bacfc9d7212597f20
    container_name: soularr
    hostname: soularr
    expose:
      - 8266
    user: 147:65536
    environment:
      WEBUI_PORT: 8266
      TZ: America/New_York
      SCRIPT_INTERVAL: 300
    volumes:
      - ${DATA3_DIR}/music/downloads:/downloads
      - ${DOCKER_DIR}/soularr:/data
    networks:
      webapps:
        ipv4_address: 172.19.0.19 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - soulseek
    restart: unless-stopped

  # creates custom music playlists in Plex based on listening history, ratings, and more
  meloday:
    image: cozza38/meloday:latest@sha256:11efadcca44f2c223a204478db7582e3a15d7761360253f7c28f14a94d25b776
    container_name: meloday
    hostname: meloday
    environment:
      PUID: 149
      PGID: 143
      TZ: America/New_York
    volumes:
      - meloday_config:/config
    networks:
      meloday:
        ipv4_address: 172.26.1.10
    extra_hosts:
      - "host.docker.internal:172.26.1.1"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # monitoring dashboard
  tautulli:
    image: linuxserver/tautulli:v2.18.2-ls247@sha256:d3c53deb09f6b8fffd1476c7154da538394193955d1e909f3b126068102fb7cf
    container_name: tautulli
    hostname: tautulli
    environment:
      PUID: 143
      PGID: 137
      TZ: America/New_York
    volumes:
      - tautulli_config:/config
    expose:
      - 8181
    networks:
      webapps:
        ipv4_address: 172.19.0.16 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # deletes content based on rules configured in a web GUI
  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:2.19.0@sha256:bee84707edaf589cda3d18b6813cbfe3a137b52786210c3a28190e10910c1240
    container_name: maintainerr
    hostname: maintainerr
    user: 150:65536
    volumes:
      - maintainerr_config:/opt/data
    environment:
      TZ: America/New_York
    expose:
      - 6246
    networks:
      webapps:
        ipv4_address: 172.19.0.21 # static IP for in-app config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - seerr
      - sonarr
      - radarr
      - radarr4k
      - tautulli
    restart: unless-stopped

  # IPTV stream proxy and EPG management
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.32.0@sha256:b7d695c5cc98b9abd64c74a94539c1ebffc23d965021613c820c67e25dea41a3
    container_name: dispatcharr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=America/New_York
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      - DISPATCHARR_PORT=9191
      - DISPATCHARR_TRUSTED_PROXIES=172.19.0.0/16
    volumes:
      - dispatcharr_data:/data
      - ./dispatcharr/patches/generator.py:/app/apps/proxy/live_proxy/output/ts/generator.py:ro
      - ./dispatcharr/patches/views.py:/app/apps/proxy/live_proxy/views.py:ro
    security_opt:
      - no-new-privileges:true

  # automatically syncs TRaSH Guides custom formats, release profiles, and quality definitions
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
    container_name: recyclarr
    hostname: recyclarr
    user: 155:65536
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "/scripts/set_secret_vars.sh", "/entrypoint.sh"]
    environment:
      TZ: America/New_York
      CRON_SCHEDULE: "@daily"
    volumes:
      - ${DOCKER_DIR}/recyclarr:/config
      - ${SCRIPTS_DIR}/set_secret_vars.sh:/scripts/set_secret_vars.sh:ro
    secrets:
      - sonarr_api_key
      - radarr_api_key
      - radarr_4k_api_key
    networks:
      webapps:
        ipv4_address: 172.19.0.32
    security_opt:
      - no-new-privileges:true
    depends_on:
      - sonarr
      - radarr
      - radarr4k
    restart: unless-stopped

    # # generates summaries, like a certain music streaming service every year
  # wrapperr:
  #   image: ghcr.io/aunefyren/wrapperr:latest
  #   container_name: wrapperr
  #   hostname: wrapperr
  #   # user: 150:65536
  #   # volumes:
  #   #   - maintainerr_config:/opt/data
  #   environment:
  #     TZ: America/New_York
  #   expose:
  #     - 8282
  #   networks:
  #     webapps:
  #       ipv4_address: 172.19.0.22 # static IP for in-app config
  #   security_opt:
  #     - no-new-privileges:true
  #   depends_on:
  #     - tautulli
  #   restart: unless-stopped

volumes:
  sonarr_config:
  radarr_config:
  radarr4k_config:
  lidarr_config:
  prowlarr_config:
  bazarr_config:
  overseerr_config:
  flaresolverr_config:
  gluetun_config:
  qbittorrent_config:
  soulseek_data:
  soulseek_config:
  tautulli_config:
  meloday_config:
  maintainerr_config:
  dispatcharr_data:

networks:
  webapps:
    external: true
  meloday:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.1.1
