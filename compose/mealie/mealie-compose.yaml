# ----------------------------------------------------------------------------------------
# Mealie is an intuitive and easy to use recipe management app!
# It allows easily importing recipes into the app from various web sources and OCR.
# Furthermore, the recipes can be added to a meal plan and then exported directly
# to shopping lists, which has become my #1 method for meal planning and grocery shopping.
# It also has a fairly well-maintained PWA, which makes mobile usage well-integrated.
# ----------------------------------------------------------------------------------------

secrets:
  POSTGRES_USER:
    file: ${SECRETS_DIR}/mealie_postgres_user
  POSTGRES_PASSWORD:
    file: ${SECRETS_DIR}/mealie_postgres_password
  SMTP_PASSWORD:
    file: ${SECRETS_DIR}/mealie_gmail_password

services:
  mealie:
    # mealie advises against using the latest tag
    # however, I like new features/bug fixes and I know how to debug
    image: ghcr.io/mealie-recipes/mealie:v3.28.0@sha256:8b02290f4d1806f02acac6f25f6d48a3c965612fda1f8e914d5af533276f8688
    container_name: mealie
    hostname: mealie
    # "Setting an explicit memory limit is recommended ... will improve idle performance"
    mem_limit: 4g
    cpu_shares: 1024
    read_only: false
    expose:
      - 9000
    depends_on:
      mealie-postgres-db:
        condition: service_healthy
    volumes:
      - mealie_data:/app/data/:rw
      - ${COMPOSE_DIR}/mealie/prompts:/app/prompts:ro
    environment:
      ALLOW_SIGNUP: false # prevents uninvited signup
      PUID: 123
      PGID: 124
      TZ: America/New_York
      BASE_URL: https://mealie.mattdies.com
      TOKEN_TIME: 168
      # database settings
      DB_ENGINE: postgres
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # email/SMTP settings
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_FROM_NAME: mealie
      SMTP_AUTH_STRATEGY: TLS
      SMTP_FROM_EMAIL: ${GMAIL}
      SMTP_USER: ${GMAIL}
      SMTP_PASSWORD_FILE: /run/secrets/SMTP_PASSWORD
      # visual settings
      THEME_LIGHT_PRIMARY: 525E3C
      THEME_DARK_PRIMARY: 525E3C
      # I use a local LLM, so I need custom prompts. My GPU isn't beefy :/
      OPENAI_CUSTOM_PROMPT_DIR: /app/prompts
      # proxy support
      SCRAPER_FLARESOLVERR_URL: http://flaresolverr:8191
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - SMTP_PASSWORD
    security_opt:
      - no-new-privileges:true
    networks:
      webapps:
        ipv4_address: 172.19.0.6
      mealie_network:
    restart: unless-stopped

  mealie-postgres-db:
    image: postgres:17
    container_name: mealie-postgres
    hostname: mealie-postgres
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$(cat /run/secrets/POSTGRES_USER) -d mealie",
        ]
      timeout: 5s
      interval: 10s
      retries: 5
    volumes:
      - mealie_postgres:/var/lib/postgresql/data:rw
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: mealie
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    networks:
      - mealie_network
    restart: unless-stopped

  # helps to bypass Cloudflare protection used by recipe sites
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: mealie-flaresolverr
    hostname: flaresolverr
    environment:
      TZ: America/New_York
    volumes:
      - flaresolverr_config:/config
    expose:
      - 8191
    networks:
      - mealie_network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  mealie_data:
  mealie_postgres:
  flaresolverr_config:

networks:
  webapps:
    external: true
  mealie_network:
    driver: bridge
