secrets:
  pihole-webpassword:
    file: ${HOME}/docker/secrets/pihole_webpassword

services:
  pihole:
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: pihole
    hostname: pihole-pi
    secrets:
      - pihole-webpassword
    environment:
      TZ: America/New_York
      PIHOLE_UID: 115
      PIHOLE_GID: 124
      WEBPASSWORD_FILE: /run/secrets/pihole-webpassword
      FTLCONF_dns_upstreams: 9.9.9.9;149.112.112.112
      FTLCONF_dns_listeningMode: local
      FTLCONF_webserver_port: 8000
      FTLCONF_misc_etc_dnsmasq_d: true
    volumes:
      - ${HOME}/docker/etc-pihole:/etc/pihole
      - ${HOME}/docker/etc-dnsmasq.d:/etc/dnsmasq.d
    network_mode: host
    restart: unless-stopped
