global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "smartctl"
    static_configs:
      - targets: ["smartctl-exporter:9633"]

  - job_name: "nvidia_gpu"
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "tautulli"
    static_configs:
      - targets: ["tautulli-exporter:8000"]

  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2019"]
