# ---------------------------------------------------------------------------------
# Unified Server Telemetry & Monitoring Stack
# - Host & Storage (Node Exporter + smartctl Exporter)
# - Container Telemetry (cAdvisor cgroups v2)
# - NVIDIA GPU Telemetry (nvidia_gpu_exporter with host PID app attribution)
# - Media / Plex Telemetry (tautulli-exporter)
# - Time Series DB (Prometheus with 30-day retention)
# - Observability & Alerting Hub (Grafana with Authelia Auth Proxy SSO & ntfy alerts)
# ---------------------------------------------------------------------------------

secrets:
  tautulli_api_key:
    file: ${SECRETS_DIR}/tautulli_api_key
  nut_exporter_username:
    file: ${SECRETS_DIR}/nut_exporter_username
  nut_exporter_password:
    file: ${SECRETS_DIR}/nut_exporter_password

volumes:
  prometheus_data:
  grafana_data:

networks:
  webapps:
    external: true

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      webapps:
        ipv4_address: 172.19.0.34
    security_opt:
      - no-new-privileges:true

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    container_name: smartctl-exporter
    restart: unless-stopped
    privileged: true
    user: root
    devices:
      - /dev/nvme0n1:/dev/nvme0n1
      - /dev/nvme0:/dev/nvme0
    networks:
      webapps:
        ipv4_address: 172.19.0.35

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.16.0@sha256:cec17e3ddfce7baefbdf116d1a259e208bb1519e4e0b18b7b0879bde0fcad5a2
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    pid: host
    environment:
      QUERY_APPS_INFO: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      webapps:
        ipv4_address: 172.19.0.36

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0@sha256:771a65c7877817cd9bb4c2d9eecb9fd1ac56f370287617658c51a35061efa71a
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
      - '--disable_metrics=percpu,sched,tcp,udp,disk,hugetlb'
    networks:
      webapps:
        ipv4_address: 172.19.0.37

  tautulli-exporter:
    build:
      context: ${DOCUMENTS_DIR}
      dockerfile: ${COMPOSE_DIR}/monitoring/Dockerfile
      target: tautulli-exporter
    image: tautulli-exporter:local
    container_name: tautulli-exporter
    restart: unless-stopped
    environment:
      TAUTULLI_URL: "http://tautulli:8181"
    volumes:
      - ${SCRIPTS_DIR}/set_secret_vars.sh:/docker-entrypoint.sh:ro
    secrets:
      - tautulli_api_key
    networks:
      webapps:
        ipv4_address: 172.19.0.38
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      webapps:
        ipv4_address: 172.19.0.39
    security_opt:
      - no-new-privileges:true

  nut-exporter:
    build:
      context: ${DOCUMENTS_DIR}
      dockerfile: ${COMPOSE_DIR}/monitoring/Dockerfile
      target: nut-exporter
    image: nut-exporter:local
    container_name: nut-exporter
    restart: unless-stopped
    command:
      - '--nut.server=10.144.88.35'
      - '--nut.vars_enable=battery.charge,battery.charge.low,battery.runtime,battery.runtime.low,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,ups.load,ups.realpower.nominal,ups.status'
    volumes:
      - ${SCRIPTS_DIR}/set_secret_vars.sh:/docker-entrypoint.sh:ro
    secrets:
      - nut_exporter_username
      - nut_exporter_password
    networks:
      webapps:
        ipv4_address: 172.19.0.41
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.2.10-security-01@sha256:4ccffa04ef20f8b32aa8732a8c4dfc5a43b61004dba67dbe91063cd71284ff9f
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.mattdies.com"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "Remote-User"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: "172.19.0.0/16,172.19.0.3"
      GF_AUTH_PROXY_HEADERS: "Email:Remote-Email,Name:Remote-Name"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      webapps:
        ipv4_address: 172.19.0.40
    depends_on:
      - prometheus
