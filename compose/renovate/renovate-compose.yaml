# --------------------------------------------------------------------------
# Renovate Self-Hosted Runner
# Scans Docker Compose files, monitors container image releases, and opens
# pull requests with digest pinning and automated safety guardrails.
# --------------------------------------------------------------------------

secrets:
  renovate_github_token:
    file: ${SECRETS_DIR}/renovate_github_token

services:
  renovate:
    image: renovate/renovate:44.188.2@sha256:a9fb71ff93d399214cfc9a564383601303cafbe4e38b94484d824705e865868e
    user: "12021:144"
    volumes:
      - ${COMPOSE_DIR}/renovate/config.js:/usr/src/app/config.js:ro
      - ${DOCKER_DIR}/renovate/cache:/tmp/renovate/cache
    secrets:
      - source: renovate_github_token
        mode: 0444
    environment:
      RENOVATE_CONFIG_FILE: /usr/src/app/config.js
      RENOVATE_TOKEN_FILE: /run/secrets/renovate_github_token
      LOG_LEVEL: info
    restart: "no"
