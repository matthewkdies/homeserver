# ------------------------------------------------------------------------
# Paperless-ngx is an open-source document management system that
# transforms physical documents and PDFs into searchable, organized
# archives using OCR (Optical Character Recognition).
# ------------------------------------------------------------------------

secrets:
  paperless_postgres_user:
    file: ${SECRETS_DIR}/paperless_postgres_user
  paperless_postgres_password:
    file: ${SECRETS_DIR}/paperless_postgres_password
  paperless_secret_key:
    file: ${SECRETS_DIR}/paperless_secret_key

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.0@sha256:7c1d98afd200def9e2bad3a377d30829e8d486554b3c818995af5860114ea17f
    container_name: paperless
    hostname: paperless
    depends_on:
      paperless-postgres:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    expose:
      - 8000
    secrets:
      - paperless_postgres_user
      - paperless_postgres_password
      - paperless_secret_key
    environment:
      USERMAP_UID: "156"
      USERMAP_GID: "156"
      TZ: America/New_York
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER_FILE: /run/secrets/paperless_postgres_user
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_postgres_password
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_URL: https://paperless.mattdies.com
      PAPERLESS_TIME_ZONE: America/New_York
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_PARALLELISM: 2
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_REMOTE_USER
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - ${DATA_DIR}/paperless/consume:/usr/src/paperless/consume
    networks:
      webapps:
        ipv4_address: 172.19.0.31
      paperless_network:
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  paperless-redis:
    image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    container_name: paperless-redis
    hostname: paperless-redis
    volumes:
      - paperless_redis:/data
    networks:
      - paperless_network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  paperless-postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    container_name: paperless-postgres
    hostname: paperless-postgres
    volumes:
      - paperless_postgres:/var/lib/postgresql/data
    secrets:
      - paperless_postgres_user
      - paperless_postgres_password
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER_FILE: /run/secrets/paperless_postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/paperless_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/paperless_postgres_user) -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperless_network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_redis:
  paperless_postgres:

networks:
  webapps:
    external: true
  paperless_network:
    driver: bridge
