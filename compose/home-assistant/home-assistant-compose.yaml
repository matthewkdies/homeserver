# ---------------------------------------------------------------------------------------
# Home Assistant is an amazing container that helps to manage automation related to smart
# devices in your home with an emphasis on privacy and control. It works by adding your
# devices via integrations, allowing fine-grained control through automations/scripts,
# groups, visualizations, and much, much more. This container is only really worth using
# if you have devices in your home that are capable of running, such as Zigbee/Z-wave
# devices or devices with accessible cloud platforms. For ultimate privacy, I recommend
# finding devices that don't require a cloud platform, but this is not always possible.
# ---------------------------------------------------------------------------------------

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    container_name: homeassistant
    hostname: homeassistant
    volumes:
      - ${DOCKER_DIR}/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # allows Bluetooth/hardware discovery on Linux
    devices:
      # add zigbee receiver dongle
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_b8cc601f2b15f0118e26e374b887153e-if00-port0
    environment:
      TZ: America/New_York
    # privileged: true grants the container access to underlying system hardware
    # useful for USB Zigbee/Z-Wave dongles or Bluetooth adapters
    privileged: true
    expose:
      - 8123 # Home Assistant Web UI & API
    networks:
      webapps:
        ipv4_address: 172.19.0.28
    restart: unless-stopped

  zwave-js-ui:
    image: zwavejs/zwave-js-ui:latest@sha256:3fef66d575ea0ea9d50aad3e05c36619228557cfa888557eac2035215a29a321
    container_name: zwave-js-ui
    hostname: zwave-js-ui
    tty: true
    stop_signal: SIGINT
    environment:
      TZ: America/New_York
      SESSION_SECRET: ${ZWAVE_SESSION_SECRET}
      ZWAVE_JS_EXTERNAL_CONFIG: /usr/src/app/store/.config-db
      TRUST_PROXY: "1"
      ZWAVE_PORT: /dev/zwave
    devices:
      - /dev/serial/by-id/usb-Zooz_800_Z-Wave_Stick_533D004242-if00:/dev/zwave
    volumes:
      - zwave-config:/usr/src/app/store
    expose:
      - 8091 # Web Management UI
      - 3000 # WebSocket API for Home Assistant
    networks:
      webapps:
        ipv4_address: 172.19.0.29
      zwave:
    restart: unless-stopped

networks:
  webapps:
    external: true
  zwave:

volumes:
  zwave-config:
    name: zwave-config
