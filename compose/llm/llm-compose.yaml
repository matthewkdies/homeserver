# -------------------------------------------------------------------------------------
# It turns out that it's really easy to run your own LLM if your GPU is capable enough.
# Mine just so happens to be, so I decided to run one! The below runs two containers:
# - Ollama: An AI model runner
# - Open WebUI: An AI web interface
# Through these two applications, it's pretty easy to self host your own LLM for
# whatever you want! I'm going to use it to program and experiment with OpenClaw
# without feeling bad about draining lakes and rivers and oceans and puddles.
# -------------------------------------------------------------------------------------

services:
  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    container_name: ollama
    hostname: ollama
    expose:
      - 11434
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_CONTEXT_LENGTH=16384
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (
          until /bin/ollama list >/dev/null 2>&1; do
            sleep 1
          done
          echo "Pre-warming Qwen3:8b into VRAM..."
          /bin/ollama run Qwen3:8b --keepalive -1m ""
          echo "Qwen3:8b is loaded and ready."
        ) &
        exec /bin/ollama serve
    volumes:
      - ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:4860ba005ae8f19f08d1e12b0868855b7b339ea0dad9927f196820fc0de04575
    container_name: open-webui
    hostname: open-webui
    expose:
      - 8080
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODELS=Qwen3:8b
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      webapps:
        ipv4_address: 172.19.0.24
      default:
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:

networks:
  webapps:
    external: true
